<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h2 class="text-2xl md:text-3xl font-black text-[#003C7D] dark:text-white">العملاء</h2>
      <p class="text-xs text-slate-500 mt-1">متابعة العملاء والخطوات القادمة بنظام جدول</p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button id="exportClientsCsvBtn" class="btn-secondary flex items-center justify-center gap-2">
        <i data-lucide="download" class="w-4 h-4"></i>
        تصدير CSV
      </button>

      <button id="addClientBtn" class="btn-primary flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i>
        إضافة عميل
      </button>
    </div>
  </div>

  <div class="flex items-center justify-between gap-3">
    <p id="clientsCountLabel" class="text-sm font-black text-slate-500 dark:text-slate-300">عدد العملاء: 0</p>
    <p class="text-xs text-emerald-600 dark:text-emerald-300 font-bold">متصل بـ Google Drive</p>
  </div>

  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full min-w-[950px] text-right border-collapse">
        <thead class="bg-[#EDF5FD] dark:bg-[#11263F] text-slate-500 dark:text-slate-300 text-xs font-black">
          <tr>
            <th class="px-4 py-4">#</th>
            <th class="px-4 py-4">اسم العميل</th>
            <th class="px-4 py-4">رقم الجوال</th>
            <th class="px-4 py-4">نوع الطلب</th>
            <th class="px-4 py-4">تاريخ المتابعة</th>
            <th class="px-4 py-4">الخطوة القادمة</th>
            <th class="px-4 py-4">الإجراءات</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody" class="divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-[#0B1F36]"></tbody>
      </table>
    </div>

    <div id="clientsTableEmpty" class="hidden p-10 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4">
        <i data-lucide="inbox" class="w-6 h-6 text-slate-400"></i>
      </div>
      <p class="font-black text-slate-500">لا يوجد عملاء مطابقين</p>
    </div>
  </div>
</div>
