<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h2 class="text-2xl md:text-3xl font-black text-[#003C7D] dark:text-white">المهام</h2>
      <p class="text-xs text-slate-500 mt-1">إدارة ومتابعة جميع المهام اليومية بنظام جدول واضح</p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button id="exportTasksCsvBtn" class="btn-secondary flex items-center justify-center gap-2">
        <i data-lucide="download" class="w-4 h-4"></i>
        تصدير CSV
      </button>

      <button id="addTaskBtn" class="btn-primary flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i>
        إضافة مهمة
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <select id="taskStatusFilter" class="input">
      <option value="all">كل الحالات</option>
      <option>جديدة</option>
      <option>قيد التنفيذ</option>
      <option>بانتظار رد</option>
      <option>مؤجلة</option>
      <option>مكتملة</option>
      <option>متأخرة</option>
    </select>

    <select id="taskPriorityFilter" class="input">
      <option value="all">كل الأولويات</option>
      <option>عاجلة جدًا</option>
      <option>عالية</option>
      <option>متوسطة</option>
      <option>منخفضة</option>
    </select>

    <select id="taskCategoryFilter" class="input">
      <option value="all">كل التصنيفات</option>
    </select>
  </div>

  <div class="flex items-center justify-between gap-3">
    <p id="tasksCountLabel" class="text-sm font-black text-slate-500 dark:text-slate-300">عدد المهام: 0</p>
    <p class="text-xs text-emerald-600 dark:text-emerald-300 font-bold">متصل بـ Google Drive</p>
  </div>

  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full min-w-[1050px] text-right border-collapse">
        <thead class="bg-[#EDF5FD] dark:bg-[#11263F] text-slate-500 dark:text-slate-300 text-xs font-black">
          <tr>
            <th class="px-4 py-4">#</th>
            <th class="px-4 py-4">عنوان المهمة</th>
            <th class="px-4 py-4">التصنيف</th>
            <th class="px-4 py-4">الأولوية</th>
            <th class="px-4 py-4">الحالة</th>
            <th class="px-4 py-4">موعد الانتهاء</th>
            <th class="px-4 py-4">المدة</th>
            <th class="px-4 py-4">الإجراءات</th>
          </tr>
        </thead>
        <tbody id="tasksTableBody" class="divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-[#0B1F36]"></tbody>
      </table>
    </div>

    <div id="tasksTableEmpty" class="hidden p-10 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4">
        <i data-lucide="inbox" class="w-6 h-6 text-slate-400"></i>
      </div>
      <p class="font-black text-slate-500">لا توجد مهام مطابقة</p>
    </div>
  </div>
</div>
